name: SupportIQ_AI Deploy

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Node.js lint + type-check + test ──────────────────────────────────────
  node-ci:
    name: Node.js (lint · types · test)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: supportiq
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: supportiq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://supportiq:test_password@localhost:5432/supportiq_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-jwt-secret-for-ci-at-least-32-chars
      OPENAI_API_KEY: sk-test-fake-key
      AI_SERVICE_URL: http://localhost:8000
      MINIO_ENDPOINT: localhost
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: test
      MINIO_SECRET_KEY: testtest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check (all workspaces)
        run: npm run type-check

      - name: Lint (all workspaces)
        run: npm run lint

      - name: Generate Prisma client
        run: npx prisma generate --schema=apps/api-gateway/prisma/schema.prisma

      - name: Run database migrations
        run: npx prisma db push --schema=apps/api-gateway/prisma/schema.prisma --force-reset

      - name: Run API Gateway tests
        run: npm test --workspace=apps/api-gateway

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          directory: apps/api-gateway/coverage
          flags: api-gateway
        continue-on-error: true

  # ─── Python lint + type-check + test ───────────────────────────────────────
  python-ci:
    name: Python (lint · types · test)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: services/ai-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/ai-service/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check app/ --ignore E501

      - name: Type check with mypy
        run: |
          pip install mypy types-requests
          mypy app/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true  # mypy warnings don't block CI

      - name: Run tests
        env:
          OPENAI_API_KEY: sk-test-fake-key
          QDRANT_URL: http://localhost:6333
          REDIS_URL: redis://localhost:6379
        run: pytest tests/ -v --tb=short

  # ─── Docker build check ────────────────────────────────────────────────────
  docker-build:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [node-ci, python-ci]

    strategy:
      matrix:
        service:
          - name: api-gateway
            context: .
            dockerfile: apps/api-gateway/Dockerfile
          - name: web
            context: .
            dockerfile: apps/web/Dockerfile
          - name: ai-service
            context: services/ai-service
            dockerfile: services/ai-service/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service.name }} image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:3001

  # ─── Deploy to staging (main branch only) ─────────────────────────────────
  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        run: |
          echo "🚀 Deploy step — wire up your cloud provider here"
          echo "Options: Railway, Render, Fly.io, AWS ECS, GCP Cloud Run, etc."
          # Example for Railway:
          # railway up --service api-gateway
          # railway up --service web
          # railway up --service ai-service
