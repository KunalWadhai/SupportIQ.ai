name: SupportIQ_AI Deploy

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_POSTGRES_USER: ${{ vars.CI_POSTGRES_USER }}
  CI_POSTGRES_DB: ${{ vars.CI_POSTGRES_DB }}
  CI_REDIS_URL: ${{ vars.CI_REDIS_URL }}

  NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
  NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
  AI_SERVICE_URL: ${{ vars.AI_SERVICE_URL }}
  API_INTERNAL_URL: ${{ vars.API_INTERNAL_URL }}
  NEXTAUTH_URL: ${{ vars.NEXTAUTH_URL }}
  QDRANT_URL: ${{ vars.QDRANT_URL }}

  MINIO_ENDPOINT: ${{ vars.MINIO_ENDPOINT }}
  MINIO_PORT: ${{ vars.MINIO_PORT }}
  MINIO_USE_SSL: ${{ vars.MINIO_USE_SSL }}
  MINIO_BUCKET: ${{ vars.MINIO_BUCKET }}

  NODE_ENV: ${{ vars.NODE_ENV }}
  ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
  RATE_LIMIT_WINDOW_MS: ${{ vars.RATE_LIMIT_WINDOW_MS }}
  RATE_LIMIT_MAX: ${{ vars.RATE_LIMIT_MAX }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}

jobs:
  # Node.js lint + type-check + test 
  node-ci:
    name: Node.js (lint · types · test)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # CI uses ephemeral local containers — fixed credentials, no GitHub vars required
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: supportiq
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: supportiq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supportiq -d supportiq_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://supportiq:test_password@localhost:5432/supportiq_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AI_SERVICE_URL: http://localhost:8000
      STORAGE_PROVIDER: minio
      MINIO_ENDPOINT: localhost
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: test
      MINIO_SECRET_KEY: testtest
      MINIO_BUCKET: supportiq-test
      QDRANT_URL: http://localhost:6333
      QDRANT_API_KEY: test-key
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required CI configuration
        run: |
          missing=0
          [ -z "$JWT_SECRET" ] && echo "❌ Missing secret: JWT_SECRET" && missing=1
          [ -z "$OPENAI_API_KEY" ] && echo "❌ Missing secret: OPENAI_API_KEY" && missing=1
          [ "$missing" -eq 0 ] || exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check (all workspaces)
        run: npm run type-check

      - name: Lint (all workspaces)
        run: npm run lint

      - name: Generate Prisma client
        run: npx prisma generate --schema=apps/api-gateway/prisma/schema.prisma

      - name: Run database migrations
        run: npx prisma migrate deploy --schema=apps/api-gateway/prisma/schema.prisma

      - name: Run API Gateway tests
        run: npm test --workspace=apps/api-gateway

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: apps/api-gateway/coverage
          flags: api-gateway
        continue-on-error: true

  # ─── Python lint + type-check + test ───────────────────────────────────────
  python-ci:
    name: Python (lint · types · test)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: services/ai-service

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      QDRANT_URL: ${{ vars.QDRANT_URL || secrets.QDRANT_URL || 'http://localhost:6333' }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY || 'test-key' }}
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate CI secrets
        run: |
          [ -n "$OPENAI_API_KEY" ] || { echo "❌ Missing secret: OPENAI_API_KEY"; exit 1; }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: services/ai-service/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check app/ --ignore E501

      - name: Type check with mypy
        run: |
          pip install mypy types-requests
          mypy app/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true

      - name: Run tests
        run: pytest tests/ -v --tb=short

  # ─── Docker build check ────────────────────────────────────────────────────
  docker-build:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [node-ci, python-ci]

    strategy:
      matrix:
        service:
          - name: api-gateway
            context: .
            dockerfile: apps/api-gateway/Dockerfile
          - name: web
            context: .
            dockerfile: apps/web/Dockerfile
          - name: ai-service
            context: services/ai-service
            dockerfile: services/ai-service/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service.name }} image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}

  # Deploy API Gateway → Render
  deploy-api-gateway:
    name: Deploy api-gateway → Render
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging

    steps:
      - name: Validate Render deploy hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "❌ Missing secret: RENDER_DEPLOY_HOOK_URL"
            echo "   Render Dashboard → your api-gateway service → Settings → Deploy Hook"
            exit 1
          fi

      - name: Trigger Render deploy
        run: |
          echo "🚀 Triggering Render deploy for api-gateway..."
          curl --fail --silent --show-error --request POST \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "✅ Render deploy triggered — check Render Dashboard for build logs"

  # Deploy Web → Vercel
  deploy-web:
    name: Deploy web → Vercel
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging

    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      API_INTERNAL_URL: ${{ vars.API_INTERNAL_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Vercel configuration
        run: |
          missing=0
          [ -z "${{ secrets.VERCEL_TOKEN }}" ] && echo "❌ Missing secret: VERCEL_TOKEN" && missing=1
          [ -z "$VERCEL_ORG_ID" ] && echo "❌ Missing variable: VERCEL_ORG_ID" && missing=1
          [ -z "$VERCEL_PROJECT_ID" ] && echo "❌ Missing variable: VERCEL_PROJECT_ID" && missing=1
          [ -z "$NEXT_PUBLIC_API_URL" ] && echo "❌ Missing variable: NEXT_PUBLIC_API_URL" && missing=1
          [ "$missing" -eq 0 ] || exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel environment
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for Vercel
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
        run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  # Deploy AI Service → AWS Lambda
  deploy-ai-service:
    name: Deploy ai-service → AWS Lambda
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ECR_REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY }}
      AWS_LAMBDA_FUNCTION_NAME: ${{ vars.AWS_LAMBDA_FUNCTION_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate AWS Lambda configuration
        run: |
          missing=0
          [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ] && echo "❌ Missing secret: AWS_ACCESS_KEY_ID" && missing=1
          [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ] && echo "❌ Missing secret: AWS_SECRET_ACCESS_KEY" && missing=1
          [ -z "$AWS_REGION" ] && echo "❌ Missing variable: AWS_REGION" && missing=1
          [ -z "$AWS_ECR_REPOSITORY" ] && echo "❌ Missing variable: AWS_ECR_REPOSITORY" && missing=1
          [ -z "$AWS_LAMBDA_FUNCTION_NAME" ] && echo "❌ Missing variable: AWS_LAMBDA_FUNCTION_NAME" && missing=1
          [ "$missing" -eq 0 ] || exit 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Lambda container image
        working-directory: services/ai-service
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="${AWS_ECR_REPOSITORY}:${IMAGE_TAG}"
          IMAGE_LATEST="${AWS_ECR_REPOSITORY}:latest"
          echo "🐳 Building Lambda container image..."
          docker build -f Dockerfile.lambda -t "$IMAGE_URI" -t "$IMAGE_LATEST" .
          docker push "$IMAGE_URI"
          docker push "$IMAGE_LATEST"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"

      - name: Update Lambda function code
        run: |
          echo "🚀 Updating Lambda function: ${AWS_LAMBDA_FUNCTION_NAME}"
          aws lambda update-function-code \
            --function-name "${AWS_LAMBDA_FUNCTION_NAME}" \
            --image-uri "${IMAGE_URI}" \
            --publish
          aws lambda wait function-updated \
            --function-name "${AWS_LAMBDA_FUNCTION_NAME}"
          echo "✅ Lambda deployed with image ${IMAGE_URI}"

      - name: Update Lambda environment variables
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          QDRANT_URL: ${{ vars.QDRANT_URL || secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: |
          jq -n \
            --arg openai "$OPENAI_API_KEY" \
            --arg qdrant_url "$QDRANT_URL" \
            --arg qdrant_key "$QDRANT_API_KEY" \
            --arg redis "$REDIS_URL" \
            '{Variables: {OPENAI_API_KEY: $openai, QDRANT_URL: $qdrant_url, QDRANT_API_KEY: $qdrant_key, REDIS_URL: $redis}}' \
            > env.json
          aws lambda update-function-configuration \
            --function-name "${AWS_LAMBDA_FUNCTION_NAME}" \
            --environment file://env.json
          echo "✅ Lambda environment variables updated"
