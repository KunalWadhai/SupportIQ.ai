services:
  postgres:
    image: postgres:16-alpine
    container_name: supportiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: supportiq
      POSTGRES_PASSWORD: supportiq_dev_password
      POSTGRES_DB: supportiq
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supportiq"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: supportiq-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass supportiq_redis_password
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "supportiq_redis_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: supportiq-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: supportiq_qdrant_key

  minio:
    image: minio/minio:latest
    container_name: supportiq-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: supportiq_minio
      MINIO_ROOT_PASSWORD: supportiq_minio_secret
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    container_name: supportiq-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=supportiq_qdrant_key
      - REDIS_URL=redis://:supportiq_redis_password@redis:6379
    depends_on:
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    container_name: supportiq-api-gateway
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DATABASE_URL=postgresql://supportiq:supportiq_dev_password@postgres:5432/supportiq
      - REDIS_URL=redis://:supportiq_redis_password@redis:6379
      - AI_SERVICE_URL=http://ai-service:8000
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_ACCESS_KEY=supportiq_minio
      - MINIO_SECRET_KEY=supportiq_minio_secret
      - MINIO_BUCKET=supportiq-docs
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=supportiq_qdrant_key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      ai-service:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:3001
        - NEXT_PUBLIC_APP_URL=http://localhost:3000
    container_name: supportiq-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - API_INTERNAL_URL=http://api-gateway:3001
    depends_on:
      - api-gateway

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:
